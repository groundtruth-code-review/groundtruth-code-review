# Copy this job into your own .gitlab-ci.yml.
#
# Two things matter and are easy to miss:
#   * GIT_DEPTH: 0 — the review diffs against the merge target, which a
#     shallow clone does not contain.
#   * GROUNDTRUTH_GITLAB_TOKEN — a project access token with `api` scope.
#     The job token (CI_JOB_TOKEN) cannot post notes.
#
# The provider key is whichever variable your `model:` needs
# (ANTHROPIC_API_KEY, OPENAI_API_KEY, ...). Set it as a masked, protected
# CI/CD variable, never in this file.

groundtruth-review:
  stage: test
  image: python:3.11-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  # A second push starts a second pipeline before the first has posted; both
  # would read the same note before either writes it back, and the second
  # write can silently drop findings the first one already recorded.
  # `interruptible` opts this job into GitLab's auto-cancel-redundant-
  # pipelines behaviour, which also needs enabling once per project under
  # Settings > CI/CD > General pipelines (on by default for new projects).
  interruptible: true
  variables:
    GIT_DEPTH: 0
    GROUNDTRUTH_MODEL: anthropic/claude-sonnet-5
  before_script:
    - pip install --quiet "git+https://github.com/groundtruth-code-review/groundtruth-code-review.git"
    - git clone --depth 1 https://github.com/groundtruth-code-review/groundtruth-code-review.git /tmp/groundtruth
  script:
    - python3 /tmp/groundtruth/adapters/gitlab/publish.py
