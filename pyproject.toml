[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "groundtruth-review"
version = "0.1.0"
description = "An AI code reviewer that proves what it claims: deterministic context (no vector DB), a verification gate before anything posts, bring-your-own key and model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Varun Kumar" }]
keywords = ["code-review", "llm", "ai", "static-analysis", "tree-sitter", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=1.8",
  "litellm>=1.80",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "httpx2>=2.0"]
# The optional server mode (docs/server-mode-design.md): an ingest API and
# the database behind it. Nothing in the base package imports these, and
# `groundtruth review` never needs them.
server = ["fastapi>=0.115", "uvicorn>=0.30", "psycopg[binary]>=3.2"]

[project.scripts]
groundtruth = "groundtruth.cli:main"
groundtruth-server = "groundtruth.server.__main__:main"

[project.urls]
Homepage = "https://github.com/groundtruth-code-review/groundtruth-code-review"
Issues = "https://github.com/groundtruth-code-review/groundtruth-code-review/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/groundtruth"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The guide generator holds pages of prose HTML. Hard-wrapping sentences at
# the column limit would make that file harder to edit and the rendered
# output no different, so line length is the one rule it is excused from.
"docs/build_guide.py" = ["E501"]
